 - name: Unpack and verify Noor V9 project  run: |
          set -euo pipefail

          echo "Checking ZIP file..."
          ls -lah
          test -f Noor_V9_Fixed.zip

          unzip -t Noor_V9_Fixed.zip

          mkdir -p source
          unzip -q Noor_V9_Fixed.zip -d source

          echo "Searching project files..."
          find source -type f \
            \( -name "settings.gradle.kts" \
            -o -name "build.gradle.kts" \
            -o -name "MainActivity.kt" \
            -o -name "render_mushaf.py" \) \
            -print

          PROJECT_FILE=$(find source -type f \
            -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")

          echo "PROJECT_DIR=$PROJECT_DIR"

          for FILE in \
            "$PROJECT_DIR/settings.gradle.kts" \
            "$PROJECT_DIR/app/src/main/java/org/noorlayantafi/app/MainActivity.kt" \
            "$PROJECT_DIR/scripts/render_mushaf.py"
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extraction and verification successful."
